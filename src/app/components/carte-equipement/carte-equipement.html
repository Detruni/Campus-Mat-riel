<article class="carte">
  <div class="carte-haut">
    <span class="categorie">{{ equipement().categorie }}</span>
    <app-badge-disponibilite [disponible]="disponible()" />
  </div>

  <h2 class="carte-titre">
    <a [routerLink]="['/materiels', equipement().id]">{{ equipement().nom }}</a>
  </h2>

  <p class="description">{{ equipement().description }}</p>
  <p class="localisation">Localisation : {{ equipement().localisation }}</p>

  @if (peutReserver()) {
    <div class="carte-bas">
      @if (reserveParMoi()) {
        <p class="note">Vous avez réservé cet équipement.</p>
      } @else if (disponible()) {
        <button type="button" (click)="reserver.emit(equipement().id)">
          Réserver <span class="visuellement-cache">{{ equipement().nom }}</span>
        </button>
      } @else {
        <p class="note">Déjà réservé par un autre étudiant.</p>
      }
    </div>
  }
</article>
