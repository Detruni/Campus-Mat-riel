<section class="carrousel" aria-roledescription="carrousel" [attr.aria-label]="libelle()">
  <div
    class="scene"
    #scene
    tabindex="0"
    role="group"
    [attr.aria-label]="libelle() + ' en 3D. Flèches gauche et droite pour changer, Entrée pour ouvrir.'"
    (keydown)="clavier($event)"
    (wheel)="molette($event)"
  >
    @if (webglIndisponible()) {
      <p class="sans-3d">La vue 3D n'est pas disponible sur ce navigateur.</p>
    }
  </div>

  <!-- Zone du haut : titre, filtres, messages fournis par la page -->
  <div class="haut">
    <ng-content select="[haut]" />
  </div>

  <div class="bas">
    <div class="capsule">
      @if (navigation()) {
        <button
          type="button"
          class="fleche"
          (click)="precedent()"
          [disabled]="indice() <= 0"
          aria-label="Élément précédent"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7" /></svg>
        </button>
      }

      <div class="contenu-capsule">
        <ng-content select="[capsule]" />
      </div>

      @if (navigation()) {
        <button
          type="button"
          class="fleche"
          (click)="suivant()"
          [disabled]="indice() >= elements().length - 1"
          aria-label="Élément suivant"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" /></svg>
        </button>
      }
    </div>

    <!-- Points de navigation : un bouton par élément, pratique au clavier -->
    @if (navigation() && elements().length > 1) {
      <ul class="points">
        @for (element of elements(); track element.cle; let i = $index) {
          <li>
            <button
              type="button"
              class="point"
              [class.actif]="i === indice()"
              [attr.aria-current]="i === indice() ? 'true' : null"
              (click)="aller(i)"
            >
              <span class="visuellement-cache">Aller à {{ element.libelle }}</span>
            </button>
          </li>
        }
      </ul>
    }
  </div>
</section>
